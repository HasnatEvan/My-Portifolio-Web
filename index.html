<!doctype html>
<html lang="en">
  <head>
    <!-- 🌐 Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="8SJiGSKYIc6i5EuJs0waqmCNIDnlwcRI0XlcK3oT64k"
    />
    <link rel="icon" type="image/png" href="/logo.jpg" />

    <title>Hasnat Evan | Web Developer Portfolio</title>

    <!-- 🧠 SEO Meta -->
    <meta
      name="description"
      content="Hi, I'm Hasnat Evan — a passionate web developer skilled in front-end and back-end technologies. Explore my portfolio to see my latest projects, skills, and achievements."
    />
    <meta
      name="keywords"
      content="Hasnat Evan, Web Developer, Frontend Developer, React Developer, JavaScript Developer, Portfolio, Bangladesh Developer"
    />
    <meta name="author" content="Hasnat Evan" />
    <link rel="canonical" href="https://your-portfolio-url.com/" />

    <!-- 🪪 Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-portfolio-url.com/" />
    <meta property="og:title" content="Hasnat Evan | Web Developer" />
    <meta
      property="og:description"
      content="Explore the portfolio of Hasnat Evan — a creative and dedicated web developer skilled in building responsive and modern web applications."
    />
    <meta property="og:image" content="/logo.jpg" />

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hasnat Evan | Web Developer" />
    <meta
      name="twitter:description"
      content="Explore my web development projects and portfolio — created by Hasnat Evan."
    />
    <meta name="twitter:image" content="/logo.jpg" />

    <!-- 🧾 Structured Data (JSON-LD for Google Rich Results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Hasnat Evan",
        "url": "https://your-portfolio-url.com/",
        "image": "/logo.jpg",
        "jobTitle": "Web Developer",
        "sameAs": [
          "https://www.linkedin.com/in/hasnatevan",
          "https://github.com/hasnatevan",
          "https://twitter.com/hasnatevan"
        ]
      }
    </script>
  </head>

  <body class="bg-[#111111] text-white">
    <!-- 🏠 React root element -->
    <div id="root"></div>

    <!-- ⚛️ React Vite entry file -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- 📩 EmailJS CDN -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>

    <!-- 🛠️ EmailJS Initialize -->
    <script type="text/javascript">
      (function () {
        emailjs.init({
          publicKey: "N2Gfn49dYvrjnYCRs", // ⚠️ এখানে নিজের public key বসাও
        });
      })();
    </script>
  </body>
</html>
